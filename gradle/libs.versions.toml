[versions]
agp = "8.7.3"
# Bumped from 2.0.21 for PORTING_PLAN.md step 2: Ktor 3.2.1+ and
# kotlinx-serialization-json 1.9.0 (both needed for the supabase-kt
# dependency below) are compiled with Kotlin 2.2.0's metadata format,
# which a 2.0.21 compiler can't read ("Module was compiled with an
# incompatible version of Kotlin ... expected version is 2.0.0" — hit for
# real during this step's build-verify pass, not assumed). The Compose
# compiler plugin tracks this same version (see `kotlin-compose` below),
# so this bump moves both together.
kotlin = "2.2.0"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
# supabase-kt (official Kotlin Multiplatform Supabase client) + its Ktor
# client engine and kotlinx.serialization, added for PORTING_PLAN.md step 2.
# Versions confirmed against Maven Central / the supabase-kt README at the
# time this was added — supabase-kt 3.1.4 is the latest release not
# tagged beta/rc, and its docs say to match the Ktor version used
# internally (3.0.0-rc-1+); 3.2.0 is Ktor's own latest stable.
# 3.2.2, not the latest (3.7.0 as of this writing) — deliberately pinned.
# supabase-kt's own CHANGELOG.md (fetched directly, not assumed) shows
# 3.2.0-3.2.6 all build against Kotlin 2.2.0/2.2.20/2.2.21, but 3.3.0
# (Jan 2026) jumps to Kotlin `3.3.0` — a major-version jump this repo's
# AGP 8.7.3 toolchain has no verified compatibility story for, and not
# worth risking for this step. 3.2.2 is the smallest bump off the
# original 3.1.4 pin that still fixes the KTOR-8583 dex bug (needs
# Ktor >= 3.2.1) while staying on the known-good Kotlin 2.2.0 line. One
# real cost of staying below 3.6.0: `Email.Config.data` (extra signup
# metadata) and the throwing `SessionManager.loadSession()` contract both
# only exist from 3.6.0 on — see KeystoreSessionManager.kt and
# SupabaseAuthService.kt's own comments for how this version's code
# works around that gap. Revisit this pin (and the Kotlin toolchain
# version) once there's a reason to verify the Kotlin 3.3.0 jump
# properly rather than as a side effect of an unrelated auth-plumbing step.
supabase = "3.2.2"
ktor = "3.2.2"
kotlinxSerializationJson = "1.9.0"
# Room, added for PORTING_PLAN.md step 5 (local persistence). 2.8.4 is the
# latest stable release (confirmed against Google's Maven metadata, not
# assumed) and requires Kotlin 2.0+, so it's compatible with this repo's
# existing 2.2.0 pin — no toolchain bump needed this time.
room = "2.8.4"
# KSP (Room's annotation processor) versions are formatted
# `<kotlinVersion>-<kspVersion>` and tied to an exact Kotlin release —
# `2.2.0-2.0.2` is the stable KSP build for this repo's pinned Kotlin
# 2.2.0 (confirmed against the KSP Gradle plugin's own maven-metadata.xml,
# same "verify against the pinned version, not latest" discipline as the
# supabase-kt/Ktor pins above).
ksp = "2.2.0-2.0.2"
# CameraX, added for PORTING_PLAN.md step 7 (camera/OCR import, Session A
# — real capture, not yet wired into any screen). 1.5.1 is the latest
# stable release (confirmed via search against Android's own CameraX
# release notes/Maven Repository, not assumed) and targets this repo's
# existing compileSdk 35 cleanly. All four artifacts below share this one
# version, matching CameraX's own "bump them together" release model.
cameraX = "1.5.1"
# ML Kit Text Recognition — the on-device, no-network Latin-script
# variant (`com.google.mlkit:text-recognition`, not the unbundled
# `com.google.android.gms:play-services-mlkit-text-recognition` variant,
# whose model downloads via Play Services on first use — bundled keeps
# this session's "confirmed fully offline" requirement true even on a
# device's very first scan). 16.0.1 confirmed as latest stable via
# Google's own ML Kit docs at the time this was added.
mlkitTextRecognition = "16.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Needed as of PORTING_PLAN.md step 5: Room's TypeConverters JSON-encode a
# couple of this app's own small value types (FlourBlendEntry,
# QueuedBakeStepPlan) via kotlinx.serialization, which requires the
# compiler plugin to generate their @Serializable machinery — step 2's
# kotlinx-serialization-json dependency didn't need this yet since it was
# only ever decoding supabase-kt's own pre-compiled types.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
